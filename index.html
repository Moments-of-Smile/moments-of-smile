<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moments of Smile</title>

  <style>
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8dff0, #dff7f6);
      color: #333;
      text-align: center;
    }

    .menu-checkbox {
      display: none;
    }

    .menu-button {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 1001;
      background: rgba(255, 255, 255, 0.95);
      color: #b76e79;
      font-size: 30px;
      padding: 8px 14px;
      border-radius: 14px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.12);
      cursor: pointer;
      line-height: 1;
    }

    .side-menu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 240px;
      height: 100%;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 5px 0 20px rgba(0,0,0,0.12);
      padding: 80px 20px 30px;
      z-index: 1000;
      transition: left 0.3s ease;
      text-align: left;
    }

    .menu-checkbox:checked ~ .side-menu {
      left: 0;
    }

    .side-menu a {
      display: block;
      color: #b76e79;
      font-weight: bold;
      text-decoration: none;
      margin: 20px 0;
      font-size: 17px;
    }

    header {
      padding: 85px 20px 40px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
      color: #b76e79;
    }

    h2 {
      color: #b76e79;
      margin-bottom: 12px;
    }

    h3 {
      color: #333;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      max-width: 750px;
      margin: 15px auto;
      padding: 0 20px;
    }

    .box {
      background: rgba(255, 255, 255, 0.75);
      margin: 30px auto;
      padding: 30px 20px;
      max-width: 780px;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .project-card {
      background: #fff5fb;
      margin: 25px auto 0;
      padding: 22px;
      max-width: 650px;
      border-radius: 20px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.06);
    }

    .status {
      font-size: 14px;
      font-weight: bold;
      color: #b76e79;
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
