<!DOCTYPE html>

  <style>
    body {

      font-family: Arial, sans-serif;

    }

    #menu-toggle {
      display: none;
    }

    .menu-button {
      position: fixed;
      top: 18px;

      top: 0;
      left: -280px;
      width: 240px;
      height: 100%;
      background: rgba(255,255,255,0.98);
      box-shadow: 5px 0 20px rgba(0,0,0,0.12);
      padding: 80px 20px 30px;
      z-index: 1000;
      transition: left 0.3s ease;
      text-align: left;
    }

    #menu-toggle:checked ~ .side-menu {
      left: 0;
    }

    .side-menu a {
      display: block;
      color: #b76e79;
      font-weight: bold;
      text-decoration: none;
      margin: 20px 0;
      font-size: 17px;

      padding: 90px 20px 40px;

      margin-bottom: 20px;
      border-radius: 0;
      mix-blend-mode: multiply;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
      color: #b76e79;
    }

    h2 {
      color: #b76e79;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      max-width: 750px;
      margin: 15px auto;
      padding: 0 20px;
    }

    .box {
      background: rgba(255,255,255,0.75);
      margin: 30px auto;
      padding: 30px 20px;
      max-width: 780px;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    a {
      color: #b76e79;
      font-weight: bold;
      text-decoration: none;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
