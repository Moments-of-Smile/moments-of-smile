<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weiterleitung zu Moments of Smile</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8dff0, #dff7f6);
      color: #333;
      text-align: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      background: rgba(255,255,255,0.85);
      padding: 35px 25px;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      max-width: 520px;
    }

    h1 {
      color: #b76e79;
      margin-bottom: 12px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    a {
      color: #b76e79;
      font-weight: bold;
      text-decoration: none;
    }
  </style>

  <script>
    setTimeout(function() {
      window.location.href = "https://moments-of-smile.de/";
    }, 1800);
  </script>
</head>

<body>

  <div class="box">
    <h1>Moments of Smile</h1>
    <p>Du wirst gleich weitergeleitet.</p>
    <p>
      Falls nichts passiert, klicke hier:
      <br>
      <a href="https://moments-of-smile.de/">Zur Webseite</a>
    </p>
  </div>
